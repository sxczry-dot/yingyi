<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script>
window.__step = 'page loaded';
document.addEventListener('pywebviewready', () => {
  window.__step = 'bridge ready';
  window.pywebview.api.get_info().then((r) => {
    window.__step = 'dict ok: ' + JSON.stringify(r).substring(0, 80);
  }).catch((e) => {
    window.__step = 'dict FAIL: ' + e;
  });
  window.pywebview.api.get_text().then((r) => {
    window.__step2 = 'text ok: ' + r;
  }).catch((e) => {
    window.__step2 = 'text FAIL: ' + e;
  });
});
</script></body></html>
