<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script>
window.__step = 'page loaded';
window.__pywebview_seen = 'never';
document.addEventListener('pywebviewready', () => { window.__step = 'EVENT fired'; });
setInterval(() => {
  if (window.pywebview && window.pywebview.api) {
    window.__pywebview_seen = 'yes at ' + new Date().toISOString().substring(11, 19);
    if (window.__step === 'page loaded') window.__step = 'api exists (no event)';
  }
}, 500);
</script></body></html>
