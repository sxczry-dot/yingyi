<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script>
window.__step = 'page loaded';
function check() {
  if (!window.pywebview || !window.pywebview.api) { setTimeout(check, 300); return; }
  window.__step = 'calling analyze';
  window.pywebview.api.analyze("D:/KB电影/Obsession.2026.2160p.4K.中英字幕.mp4").then((r) => {
    window.__step = 'analyze OK: ' + JSON.stringify(r).substring(0, 120);
  }).catch((e) => {
    window.__step = 'analyze FAIL: ' + String(e).substring(0, 120);
  });
}
setTimeout(check, 1500);
</script></body></html>
